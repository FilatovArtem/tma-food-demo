services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    expose: ["8000"]
    networks: [appnet]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    networks: [appnet]
    restart: unless-stopped

volumes:
  sqlite-data:

networks:
  appnet:
